[project]
name = "t80-tile-planner"
version = "0.1.0"
description = "Scientific tile catalogue planning for the T80-South telescope"
requires-python = ">=3.12"
dependencies = [
  "astropy>=6.1,<8",
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

